components:
  schemas:
    Experience:
      type: object
      required:
        - role
        - orgName
        - orgLogoUrl
        - startDate
        - endDate
        - description
      properties:
        id:
          type: string
          description: Unique identifier for the experience
        role:
          type: string
          description: Role or job title
        orgName:
          type: string
          description: Name of the organization
        orgLogoUrl:
          type: string
          description: URL to the organization's logo
        startDate:
          type: string
          format: date-time
          description: Start date of the experience
        endDate:
          type: string
          format: date-time
          description: End date of the experience
        description:
          type: string
          description: Details of the experience
    ExperienceInput:
      type: object
      required:
        - role
        - orgName
        - orgLogoUrl
        - startDate
        - endDate
        - description
      properties:
        role:
          type: string
          description: Role or job title
        orgName:
          type: string
          description: Name of the organization
        orgLogoUrl:
          type: string
          description: URL to the organization's logo
        startDate:
          type: string
          format: date-time
          description: Start date of the experience
        endDate:
          type: string
          format: date-time
          description: End date of the experience
        description:
          type: string
          description: Details of the experience
